x-healthcheck: &healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health',{signal:AbortSignal.timeout(2000)}).then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  estudiantes:
    build: ./services/estudiantes
    healthcheck: *healthcheck
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_PATH: /app/data/estudiantes.sqlite
    volumes:
      - estudiantes_data:/app/data

  validacion-universitaria:
    build: ./services/validacion-universitaria
    healthcheck: *healthcheck
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      DB_PATH: /app/data/validaciones.sqlite
      ESTUDIANTES_URL: http://estudiantes:3001
    volumes:
      - validaciones_data:/app/data
    depends_on:
      estudiantes:
        condition: service_healthy

  menus:
    build: ./services/menus
    healthcheck: *healthcheck
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      DB_PATH: /app/data/menus.sqlite
    volumes:
      - menus_data:/app/data

  pedidos:
    build: ./services/pedidos
    healthcheck: *healthcheck
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      DB_PATH: /app/data/pedidos.sqlite
      ESTUDIANTES_URL: http://estudiantes:3001
      VALIDACIONES_URL: http://validacion-universitaria:3002
      MENUS_URL: http://menus:3003
    volumes:
      - pedidos_data:/app/data
    depends_on:
      estudiantes:
        condition: service_healthy
      validacion-universitaria:
        condition: service_healthy
      menus:
        condition: service_healthy

volumes:
  estudiantes_data:
  validaciones_data:
  menus_data:
  pedidos_data:

version: '3.8'

services:
  menus-db:
    image: postgres:15-alpine
    container_name: menus-db
    environment:
      POSTGRES_DB: menus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  ms-menus:
    build: .
    container_name: ms-menus
    ports:
      - "3002:3002"
    environment:
      DB_HOST: menus-db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: menus_db
      PORT: 3002
    depends_on:
      - menus-db
